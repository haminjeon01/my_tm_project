<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI로 추상화 분류하기_6학년 미술 </title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #image-preview { max-width: 300px; margin: 20px auto; display: none; }
        #label-container { margin-top: 20px; font-size: 1.2rem; font-weight: bold; }
        .result-item { margin: 5px 0; }
    </style>
</head>
<body>
    <h1>추상화 분류 모델 (파일 업로드 방식)</h1>
    
    <!-- 파일 선택 버튼 -->
    <input type="file" id="file-input" accept="image/*">
    
    <!-- 선택한 이미지 미리보기 -->
    <div>
        <img id="image-preview" src="#" alt="미리보기">
    </div>

    <!-- 결과 표시창 -->
    <div id="label-container">이미지를 업로드하면 결과가 나옵니다.</div>

    <!-- 티쳐블 머신 라이브러리 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        // 내 모델 링크
        const URL = "https://teachablemachine.withgoogle.com/models/iqukOayTt/";

        let model, labelContainer, maxPredictions;

        // 모델 로드 함수
        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();
            labelContainer = document.getElementById("label-container");
        }

        // 파일 업로드 이벤트 처리
        const fileInput = document.getElementById('file-input');
        const imagePreview = document.getElementById('image-preview');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                imagePreview.src = event.target.result;
                imagePreview.style.display = 'block';
                // 이미지 로드가 완료되면 예측 실행
                imagePreview.onload = () => {
                    predict();
                };
            };
            reader.readAsDataURL(file);
        });

        // 예측 함수
        async function predict() {
            if (!model) await init(); // 모델이 로드 안 됐으면 로드
            
            const prediction = await model.predict(imagePreview);
            labelContainer.innerHTML = ""; // 이전 결과 지우기

            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction =
                    prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(1) + "%";
                const div = document.createElement("div");
                div.className = "result-item";
                div.innerHTML = classPrediction;
                labelContainer.appendChild(div);
            }
        }

        // 페이지 접속 시 모델 미리 로드
        init();
    </script>
</body>
</html>
